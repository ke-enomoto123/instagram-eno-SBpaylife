name: Daily Post (Instagram + X)

on:
  schedule:
    - cron: '0 2 * * *'    # 11:00 JST (主婦の家事一段落枠)
  workflow_dispatch:

jobs:
  # ── Job 1: キャプション・画像・Xテキストを生成してSlackに通知 ──
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Japanese fonts (for carousel slides)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Random delay (avoid mechanical posting pattern)
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 1200))
          echo "Random delay: ${DELAY}s"
          sleep $DELAY
      - name: Generate post & notify Slack
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/generate_post.py
      - name: Upload post data
        uses: actions/upload-artifact@v4
        with:
          name: post-data
          path: post_data.json
          retention-days: 1

  # ── Job 2: 承認後にInstagram＋X へ同時投稿 ──────────────────────
  post:
    needs: generate
    environment: preview        # ← ここで承認待ち
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download post data
        uses: actions/download-artifact@v4
        with:
          name: post-data
      - name: Post to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
        run: python scripts/post_instagram.py
      - name: Post to X (with image)
        env:
          X_OAUTH2_CLIENT_ID: ${{ secrets.X_OAUTH2_CLIENT_ID }}
          X_OAUTH2_CLIENT_SECRET: ${{ secrets.X_OAUTH2_CLIENT_SECRET }}
          X_OAUTH2_REFRESH_TOKEN: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
          # OAuth 1.0a (v1.1 メディアアップロード fallback 用)
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/post_x_with_image.py
